# Facai Cloud reverse proxy for whstapp.lol.
# Install to /etc/nginx/sites-available/facai-cloud.conf and enable with:
#   ln -s /etc/nginx/sites-available/facai-cloud.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# This is the TLS server. It references /etc/letsencrypt/live/whstapp.lol/..., so
# it must only be enabled AFTER `deploy.sh cert` has issued a certificate;
# otherwise `nginx -t` fails. deploy.sh installs the HTTP bootstrap
# (facai-cloud.http.conf) first and swaps to this file once the cert exists.
# The upstream binds to loopback only; nginx terminates TLS and forwards
# X-Forwarded-* to the app.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-IP request budget for the surfaces that are reachable without a session:
# /login is a password oracle and /api is the whole backend. 10m of state is
# roughly 160k distinct addresses. limit_req_zone is only valid in the http
# context, so it sits here beside the map, above both server blocks.
limit_req_zone $binary_remote_addr zone=facai_edge:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name whstapp.lol www.whstapp.lol;

    # Let's Encrypt HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name whstapp.lol www.whstapp.lol;

    ssl_certificate     /etc/letsencrypt/live/whstapp.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whstapp.lol/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS without includeSubDomains: subdomains are not all known to be HTTPS.
    # X-Content-Type-Options, X-Frame-Options and Referrer-Policy are owned by
    # the app (facai/api.py SECURITY_HEADERS): repeating them here would add a
    # second copy to every proxied response, and a duplicated X-Frame-Options is
    # undefined for browsers. HSTS and CSP stay here because the app does not
    # set them, and `always` keeps them on nginx-generated pages (413 for a body
    # over client_max_body_size, 503 from the limiter).
    add_header Strict-Transport-Security "max-age=63072000" always;
    # img-src must list data: explicitly: the WeChat login QR code is always a
    # data:image/png;base64 URL, and the data: scheme is not covered by 'self'.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 2m;

    # Server-Sent Events (mission stream) must not be buffered or cached.
    # A regex location is matched before the /api/ prefix location below, which
    # would otherwise strip the streaming settings, so this block repeats the
    # rate limit (or the stream path would bypass the /api shed) and the HSTS /
    # CSP pair, because any add_header here suppresses server-level inheritance.
    location ~ ^/api/v1/missions/[^/]+/stream$ {
        limit_req zone=facai_edge burst=20 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self'" always;
    }

    # /api and /login are reachable without a session (login is the password
    # oracle, /api is everything else), so both take the per-IP shed: the burst
    # absorbs one page load, nodelay refuses the overflow instead of queueing
    # it, and the app's own 5-failure lockout stays the second line of defense.
    # Plain prefix, not ^~, so the SSE regex location above keeps precedence.
    location /api/ {
        limit_req zone=facai_edge burst=20 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /login {
        limit_req zone=facai_edge burst=20 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
