# Facai Cloud HTTP bootstrap for whstapp.lol — NO TLS, NO certificate required.
#
# Purpose: during a first-time install the TLS certificate does not exist yet, so
# an `ssl_certificate` path cannot be referenced (nginx -t would fail). This file
# is installed as /etc/nginx/sites-available/facai-cloud.conf until a certificate
# is present. It only serves the Let's Encrypt HTTP-01 challenge and refuses to
# expose the application over plaintext HTTP.
#
# deploy/deploy.sh:
#   install -> if no cert, installs this file and reloads nginx
#   cert    -> runs certbot against this webroot, then installs facai-cloud.conf
#              (the TLS server) and reloads nginx again.

server {
    listen 80;
    listen [::]:80;
    server_name whstapp.lol www.whstapp.lol;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot -w /var/www/certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # No certificate yet: do not proxy the app over plaintext.
    location / {
        default_type text/plain;
        return 503 "TLS is not configured yet. Run: sudo FACAI_EMAIL=you@example.com ./deploy/deploy.sh cert\n";
    }
}
